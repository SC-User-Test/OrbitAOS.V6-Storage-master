apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbitaos-v6-ingress
  namespace: orbitaos-v6
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
    - host: orbitaos-v6.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbitaos-v6-service
                port:
                  number: 80
