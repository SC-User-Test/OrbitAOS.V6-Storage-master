apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitaos-v6
  namespace: orbitaos-v6
  labels:
    app: orbitaos-v6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitaos-v6
  template:
    metadata:
      labels:
        app: orbitaos-v6
    spec:
      containers:
        - name: orbitaos-v6
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__DefaultConnection
              value: "{{DATABASE_URL}}"
            - name: AppSettings__ApiKey
              value: "{{API_KEY}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
