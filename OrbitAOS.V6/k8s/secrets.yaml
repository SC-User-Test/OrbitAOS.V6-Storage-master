apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orbitaos-azure-keyvault
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set to your Azure Managed Identity Client ID
    keyvaultName: "your-keyvault-name"  # Set to your Azure Key Vault name
    cloudName: ""
    objects: |
      array:
        - |
          objectName: orbitaos-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: orbitaos-db-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: orbitaos-auth-client-secret
          objectType: secret
          objectVersion: ""
    tenantId: "your-tenant-id"  # Set to your Azure AD Tenant ID
  secretObjects:
  - secretName: orbitaos-secrets
    type: Opaque
    data:
    - objectName: orbitaos-api-key
      key: AppSettings__ApiKey
    - objectName: orbitaos-db-connection-string
      key: ConnectionStrings__DefaultConnection
    - objectName: orbitaos-auth-client-secret
      key: AppSettings__AuthClientSecret

---
# Alternative: Kubernetes Secret (for non-Azure environments)
# NOTE: In production, use Azure Key Vault CSI Driver instead
apiVersion: v1
kind: Secret
metadata:
  name: orbitaos-secrets-manual
  namespace: default
type: Opaque
stringData:
  AppSettings__ApiKey: "your-api-key-here"
  ConnectionStrings__DefaultConnection: "Server=sql-server;Database=OrbitAOS;User Id=sa;Password=YourPassword123;"
  AppSettings__AuthClientSecret: "your-auth-client-secret"
